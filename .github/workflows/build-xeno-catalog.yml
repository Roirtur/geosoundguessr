name: Build Xeno-canto catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run catalog:xeno
        env:
          XENO_CANTO_API_KEY: ${{ secrets.XENO_CANTO_API_KEY }}
      - name: Commit catalog
        run: |
          git diff --quiet -- server/data/seed-sounds.json || (
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add server/data/seed-sounds.json
            git commit -m 'Build documented Xeno-canto sound catalog'
            git push
          )
