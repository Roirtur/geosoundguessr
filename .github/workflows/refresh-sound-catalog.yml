name: Refresh sound catalog

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run catalog:commons
      - name: Commit changed catalog
        run: |
          git diff --quiet -- server/data/seed-sounds.json || (
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add server/data/seed-sounds.json
            git commit -m 'Refresh documented Commons sound catalog'
            git push
          )
